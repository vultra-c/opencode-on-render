# yaml-language-server: $schema=https://render.com/schema/render.yaml.json
previews:
  generation: off

services:
  - type: web
    name: opencode
    runtime: docker
    region: oregon          # 可改成 singapore 离中国更近
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    envVars:
      - key: OPENCODE_SERVER_PASSWORD
        generateValue: true
      - key: OPENCODE_SERVER_USERNAME
        value: opencode
      - key: OPENCODE_SERVER_COMMAND
        value: web
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: RENDER_API_KEY
        sync: false
      - key: REPO_URL
        sync: false
      - key: REPO_BRANCH
        sync: false
      - key: GITHUB_TOKEN
        sync: false
